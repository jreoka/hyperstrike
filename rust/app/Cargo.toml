[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Hyperstrike pure Rust multiplayer & authoritative 120Hz simulation server"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
match_engine = { path = "../match_engine" }
server_core = { path = "../server_core" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
futures-util = "0.3"
serde_json = "1"
sim = { path = "../sim" }
tokio-tungstenite = "0.29"

[workspace]
