services:
  hyperstrike:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyperstrike
    restart: always
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
      URL: "https://hyperstrike.dill.moe"
      TRUST_PROXY: 1
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
