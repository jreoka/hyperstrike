# fly.toml app configuration file generated for dill-hyperstrike on 2026-11-20T17:58:54-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'dill-hyperstrike'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '8080'
  URL = 'https://hyperstrike.dill.moe'

[[mounts]]
  source = 'hyperstrike_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 160

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
